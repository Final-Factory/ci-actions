name: Playwright browsers (portable)
description: >
  The browsers for the @playwright/test in node_modules (run it after npm ci). The FFBox image bakes
  them for one Playwright version under /opt/ms-playwright, because Chromium's download host cannot
  be fenced by name: there the step checks that version and fails naming the line to bump. Anywhere
  else it runs `npx playwright install`.
inputs:
  browsers:
    description: Space-separated browsers to install where they are not baked.
    default: chromium
  working-directory:
    description: The directory whose node_modules has @playwright/test.
    default: '.'
  with-deps:
    description: "'true' to install the system libraries too (needs sudo; GitHub's Linux runners have it)."
    default: 'true'
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
        WITH_DEPS: ${{ inputs.with-deps }}
      run: |
        want=$(node -p "require('@playwright/test/package.json').version")
        if [ -f /opt/ms-playwright/PLAYWRIGHT_VERSION ]; then
          have=$(cat /opt/ms-playwright/PLAYWRIGHT_VERSION)
          if [ "$want" != "$have" ]; then
            echo "::error::package-lock.json has Playwright $want, the runner image has browsers for $have: bump PLAYWRIGHT_VERSION in ffbox scripts/Dockerfile (the host rebuilds the image on its next update), then re-run"
            exit 1
          fi
          echo "Playwright $have's browsers are in the runner image"
          exit 0
        fi
        deps=""
        [ "$WITH_DEPS" = true ] && [ "$RUNNER_OS" = Linux ] && deps=--with-deps
        # shellcheck disable=SC2086 # BROWSERS is a list
        npx playwright install $deps $BROWSERS
