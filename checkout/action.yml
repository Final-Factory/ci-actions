name: Checkout (portable)
description: >
  actions/checkout that works on any runner. On an FFBox runner, whose fence cannot reach github.com,
  the host's mirror of this repository is brought up to this commit first and git is pointed at it
  (for a pull request merged before the job started, its head commit, with a warning); on GitHub's
  runners or any other machine it is actions/checkout and nothing else.
inputs:
  fetch-depth:
    description: Commits to fetch; 0 for every branch and tag (actions/checkout's own input).
    default: '1'
  ref:
    description: The branch, tag or commit to check out; empty for the event's own (actions/checkout's).
    default: ''
outputs:
  ffbox:
    description: "'true' on an FFBox runner."
    value: ${{ steps.where.outputs.ffbox }}
runs:
  using: composite
  steps:
    # On FFBox: the host's mirror, up to this commit, or a merged pull request's head when its test
    # merge is gone (scripts/ffbox-mirror.sh says why). Anywhere else: nothing.
    - id: where
      shell: bash
      env:
        SHA: ${{ github.sha }}
        EVENT: ${{ github.event_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REF_IN: ${{ inputs.ref }}
      run: '"$GITHUB_ACTION_PATH/../scripts/ffbox-mirror.sh"'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ steps.where.outputs.ref || inputs.ref }}
