name: Test the actions

# On GitHub's runners (free for a public repository). The FFBox side is exercised by the
# repositories that use these actions, whose jobs run there (ff-factory's ci.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    name: Every uses is pinned by commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-pins.sh
      - run: scripts/test-ffbox-mirror.sh
      - run: shellcheck scripts/*.sh

  actions:
    name: The actions on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # The action under test needs this repository first, so the first checkout is the plain one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-actions
      - id: co
        uses: ./ci-actions/checkout
        with:
          fetch-depth: 2
      - name: checkout says it is not FFBox, and fetched two commits
        run: |
          test "${{ steps.co.outputs.ffbox }}" = false
          test "$(git rev-list --count HEAD)" = 2
      # checkout cleaned the workspace; put the actions back beside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-actions
      - id: setup
        uses: ./ci-actions/setup
        with:
          node: '22'
          node-cache: ''
          gitleaks: 8.30.1
          shellcheck: 'true'
      - name: the toolchain is the one asked for
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = 22
          test "$(gitleaks version | sed 's/^v//')" = 8.30.1
          shellcheck --version
          test "${{ steps.setup.outputs.ffbox }}" = false
      - name: a package with Playwright
        run: |
          mkdir pw && cd pw && npm init -y >/dev/null && npm install --no-audit --no-fund @playwright/test@1.63.0
      - name: playwright installs its browsers where none are baked
        uses: ./ci-actions/playwright
        with:
          browsers: chromium
          working-directory: pw
      - run: mkdir -p out && echo hello > out/a.txt
      - uses: ./ci-actions/upload
        with:
          name: upload-test-${{ matrix.os }}
          path: out
          retention-days: 1
